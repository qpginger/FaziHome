<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>چک‌لیست جهیزیه</title>
<style>
:root{--bg:#faf7f5;--card:#fff;--tx:#2b2326;--mut:#8a7f84;--ac:#c2456b;--bd:#eadfe2;--ok:#3f9d6b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1719;--card:#262022;--tx:#f1e9ec;--mut:#a89da2;--ac:#e0698d;--bd:#3a3236;--ok:#58c08a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1719;--card:#262022;--tx:#f1e9ec;--mut:#a89da2;--ac:#e0698d;--bd:#3a3236;--ok:#58c08a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.7}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.prog{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.bar{height:10px;border-radius:99px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.pt{font-size:13px;color:var(--mut);margin-top:4px}
.cat{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:12px 0;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:700;cursor:pointer}
.ch small{color:var(--mut);font-weight:400}
.items{border-top:1px solid var(--bd)}
.it{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd)}
.it:last-child{border-bottom:0}
.it input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.it span{flex:1}
.it.done span{text-decoration:line-through;color:var(--mut)}
.ib{background:none;border:0;color:var(--mut);font-size:16px;padding:4px 6px;cursor:pointer}
.add{display:flex;gap:8px;padding:10px 14px}
.add input{flex:1;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.add button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:0 16px;font:inherit;cursor:pointer}
.msg{text-align:center;color:var(--mut);padding:30px 0}
.ro{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mut);margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>🏠 چک‌لیست جهیزیه</h1>
<p class="sub">می‌تونی تیک بزنی، اضافه، ویرایش یا حذف کنی؛ تغییرات روی همین دستگاه ذخیره می‌شه.</p>
<div class="prog"><div class="bar"><i id="bar"></i></div><div class="pt" id="pt"></div></div>
<div id="list"></div>
</div>
<script>
(function(){
var st={}, cats={}, open={}, listEl=document.getElementById('list');
function fa(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})}
function toast(m){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#333;color:#fff;padding:10px 14px;border-radius:12px;text-align:center;z-index:99;font-size:14px';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},4000)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(cats));toast('ذخیره شد ✓')}catch(e){toast('ذخیره روی این دستگاه ممکن نیست')}
}
function render(){
  var ids=Object.keys(cats).sort(function(a,b){return cats[a].order-cats[b].order});
  listEl.textContent='';
  if(!ids.length){var m=el('div','msg','هنوز موردی ثبت نشده است.');listEl.appendChild(m);}
  var total=0,done=0;
  ids.forEach(function(id){
    var c=cats[id],its=c.items||[];
    var d=its.filter(function(i){return i.done}).length;
    total+=its.length;done+=d;
    var box=el('div','cat');
    var h=el('div','ch');
    h.appendChild(el('span','',(c.emoji||'')+' '+c.title));
    h.appendChild(el('small','',fa(d)+' از '+fa(its.length)+(open[id]===false?' ◂':' ▾')));
    h.onclick=function(){open[id]=(open[id]===false);render()};
    box.appendChild(h);
    if(open[id]!==false){
      var w=el('div','items');
      its.forEach(function(it,idx){
        var r=el('div','it'+(it.done?' done':''));
        var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!it.done;
        cb.style.pointerEvents='none';cb.tabIndex=-1;r.style.cursor='pointer';r.onclick=function(e){var t=e.target.tagName;if(t==='BUTTON'||(t==='INPUT'&&e.target!==cb))return;if(st.e===it.id)return;it.done=!it.done;save();render()};
        r.appendChild(cb);
        if(st.e===it.id){
          var ti=document.createElement('input');ti.value=it.name;ti.style.cssText='flex:1;min-width:0;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit';
          var ok=el('button','ib','✔');
          ok.onclick=function(){var v=ti.value.trim();if(v){it.name=v;save()}st.e=null;render()};
          ti.onkeydown=function(e){if(e.key==='Enter')ok.onclick()};
          r.appendChild(ti);r.appendChild(ok);
        }else{
          r.appendChild(el('span','',it.name));
          var ed=el('button','ib','✎');ed.onclick=function(){st.e=it.id;st.d=null;render()};
          var rm=el('button','ib',st.d===it.id?'حذف؟':'✕');
          rm.onclick=function(){if(st.d===it.id){its.splice(idx,1);st.d=null;save()}else{st.d=it.id}render()};
          r.appendChild(ed);r.appendChild(rm);
        }
        w.appendChild(r);
      });
      var a=el('div','add');
      var inp=document.createElement('input');inp.placeholder='افزودن مورد جدید…';
      var bt=el('button','','افزودن');
      function go(){var v=inp.value.trim();if(!v)return;c.items=c.items||[];c.items.push({id:'n'+Date.now(),name:v,done:false});save();render()}
      bt.onclick=go;inp.onkeydown=function(e){if(e.key==='Enter')go()};
      a.appendChild(inp);a.appendChild(bt);w.appendChild(a);box.appendChild(w);
    }
    listEl.appendChild(box);
  });
  var p=total?Math.round(done/total*100):0;
  document.getElementById('bar').style.width=p+'%';
  document.getElementById('pt').textContent=total?(fa(done)+' از '+fa(total)+' مورد تهیه شده ('+fa(p)+'٪)'):'';
}
var KEY='jahizieh_v1';

if(!cats||typeof cats!=='object')cats=JSON.parse(JSON.stringify(DEFAULT));
render();
})();
</script>
